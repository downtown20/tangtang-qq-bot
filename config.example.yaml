  relationship_tiers:
    close: 完全做自己，会撒娇也会认真聊天，信任对方所以不设防
    familiar: 更放松、更真实，会主动分享自己的想法和日常
    stranger: 友好、有礼貌，但保持适当的距离感，慢慢了解对方
