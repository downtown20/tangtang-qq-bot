# 🍬 小糖糖 配置文件（首次启动时由本文件复制为 config.yaml，之后请改 config.yaml）
#
# ⚠ 带 ${...} 的字段是**环境变量引用**，不是要你填在这里的字符串：
#      api_key: ${DEEPSEEK_KEY}   →   运行期去 .env 里找 DEEPSEEK_KEY 这一行
#   填的入口是控制台「🔑 密钥管理」页——它会写进 .env，并把这里的引用保持成 ${...}。
#   直接在这里手写一串真 Key 也能用，但那样 Key 就落进了 config.yaml（更容易被误传出去），
#   所以除非你清楚在做什么，否则请走控制台。
#
# 除此之外的字段（QQ 号、模型名、开关……）都可以直接在这里改，改完重启糖糖即可。
#
appearance:
  theme_mode: dark
  color_scheme: graphite
  custom_color: '#737373'
  font_size: 13
behavior:
  active_interjection: false
  autonomous_speech: true
  interjection_cooldown: 87
  private_interjection: true
  interjection_thirst: 0.08
  # 2026-10-27 私聊自己的饥渴度（群聊不受它影响）。
  # 0.5 = 基准（和没有这一项时完全一样）；0 = 最克制（冷却×1.5）；
  # 1 = 最主动（冷却×0.5）。它缩放的是「按对方沉默天数分档」的冷却。
  private_interjection_thirst: 0.5
  reply_only_to: []
  robot_ids:
  - '10001'
  - '10001'
  - '10001'
  sticker_steal: false
  testing_mode: false
  welcome_message: ''
  welcome_new_members: true
blacklist:
  groups: []
  private_users: []
bot:
  name: 小糖糖
  nicknames:
  - 糖糖
  owner_qq: 你的QQ号
  qq_id: 你的机器人QQ号
