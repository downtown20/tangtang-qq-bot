# 协议分组 —— 界面上「怎么理解对方 / 怎么回 / …」这些小标题就是这份文件。
#
# · 顺序 = 界面从上往下的顺序，想调整就整块上下移动；
# · `key` 是**结构**（每条协议文件头的 `group:` 指向它），改了 key 等于让指向它的
#   协议全部落到「未分组」——所以 key 别改；
# · `title` / `desc` 是**文案**，随便改。桌面端双击组标题改的也是这里的 title。
#
# 为什么单独一份文件：组是组级的东西（顺序/名字/说明），把它写进每条协议的文件头
# 就会有 N 份副本，改哪份生效取决于遍历顺序——2026-10-26 的「改 group 位置迁移」
# 「改 group_title 不生效」「两个组合并」全是这一个原因。
---
- key: understand
  title: 怎么理解对方
  desc: 难聊、被纠正、涉及要紧事的时候，先怎么想
- key: reply
  title: 怎么回
  desc: 长度、语气、接不接话——这些决定她像不像在聊天
- key: memory
  title: 记错的时候怎么办
  desc: 证据排哪一层、标记是什么意思、纠正要不要真写回
- key: boundary
  title: 知道但不该说
  desc: 检索到的资料怎么用、别人的隐私问到什么程度
- key: delivery
  title: 发送与自报
  desc: 她能用哪些发送标记，以及标记怎么让她表现
- key: intent
  title: 意图判断
  desc: 让她自己判断对方到底想要什么
